    scope: '<circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>',
    spark: '<path d="M12 3c.5 4.5 1.5 6 6 6.5-4.5.5-5.5 2-6 6.5-.5-4.5-1.5-6-6-6.5 4.5-.5 5.5-2 6-6.5Z"/><path d="M19 15v4M17 17h4M5 4v3M3.5 5.5h3"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
    bulb: '<path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.7 11.8c.5.4.7 1 .7 1.7h6c0-.7.2-1.3.7-1.7A6.5 6.5 0 0 0 12 2.5Z"/>',
    flame: '<path d="M12 22c4 0 7-2.8 7-6.8 0-3.7-2.6-5.7-4-9.2-1 2-2 3-3.6 3.2.2-2.4-.4-4.6-2.4-6.7-.8 4.4-5 6.8-5 12.4C4 19.2 7.6 22 12 22Z"/><path d="M12 22c-1.7 0-3-1.2-3-3 0-2 1.6-2.8 2.5-4.6.9 1.5 3.5 2.5 3.5 4.6 0 1.8-1.3 3-3 3Z"/>',
    hourglass: '<path d="M6 2.5h12M6 21.5h12M7.5 2.5c0 5 9 5.5 9 9.5s-9 4.5-9 9.5M16.5 2.5c0 5-9 5.5-9 9.5s9 4.5 9 9.5"/>',
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5Z"/><path d="M17 3.5v3M15.5 5h3"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    question: '<circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.3-2.7 4.1M12 17.3v.2"/>',
    heart: '<path d="M12 20.5s-8-4.8-8-10.8a4.4 4.4 0 0 1 8-2.6 4.4 4.4 0 0 1 8 2.6c0 6-8 10.8-8 10.8Z"/>',
    crown: '<path d="m3 7.5 4.5 4.5L12 5l4.5 7L21 7.5 19 19H5Z"/><path d="M5 19h14"/>',
    bolt: '<path d="M13.5 2 4.5 13.5h6.5L10 22l9.5-12H13Z"/>',
    calc: '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M9 11v4M7 13h4M13.5 12h3M13.5 15h3M8 18.5h0M12 18.5h0M16 18.5h0"/>',
    snow: '<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.5 4l2.5 2.5L14.5 4M9.5 20l2.5-2.5 2.5 2.5M3.4 10.3l3.4.9-.9 3.4M20.6 13.7l-3.4-.9.9-3.4M5.9 9.4l.9-3.4 3.4.9M18.1 14.6l-.9 3.4-3.4-.9"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
    triple: '<rect x="2.5" y="8.5" width="5.5" height="7" rx="1.4"/><rect x="9.25" y="5.5" width="5.5" height="13" rx="1.4"/><rect x="16" y="8.5" width="5.5" height="7" rx="1.4"/><path d="m10.5 12 1.2 1.3 2-2.3"/>',
    rewind: '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 2"/>',
    star: '<path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9Z"/>',
  };
  // зубчатый край медали
  const ROSETTE = (() => {
    const pts = [];
    for (let k = 0; k < 32; k++) { const r = k % 2 ? 28 : 30.5, a = k / 32 * Math.PI * 2; pts.push(`${(32 + r * Math.sin(a)).toFixed(2)} ${(32 - r * Math.cos(a)).toFixed(2)}`); }
    return 'M' + pts.join('L') + 'Z';
  })();
  function medal(d, tier) {
    const t = tier ? tierNames(d.tiers.length)[tier - 1] : 'locked';
    return `<svg class="medal m-${t}" viewBox="0 0 64 64" aria-hidden="true">
      <path class="m-rim" d="${ROSETTE}"/>
      <circle class="m-face" cx="32" cy="32" r="23"/>
      <circle class="m-ring" cx="32" cy="32" r="19.5"/>
      <path class="m-gloss" d="M13 27a20 20 0 0 1 32-12c-9-2-22 1-32 12Z"/>
      <g class="m-icon" transform="translate(20 20)">${ICONS[d.icon] || ICONS.star}</g>
    </svg>`;
  }
  function defsSvg() {
    if ($('medalDefs')) return;
    const grad = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1">${stops.map((c, k) => `<stop offset="${k / (stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;
    const div = document.createElement('div');
    div.innerHTML = `<svg id="medalDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      ${grad('gBronzeR', ['#e3a066', '#8e4a1c'])}${grad('gBronzeF', ['#f6c08c', '#c06f33', '#a55a24'])}
      ${grad('gSilverR', ['#e9edf5', '#6f7890'])}${grad('gSilverF', ['#ffffff', '#c3cad8', '#9aa3b8'])}
      ${grad('gGoldR', ['#ffe07a', '#a86f00'])}${grad('gGoldF', ['#fff3b0', '#f5c542', '#d99a10'])}
      ${grad('gFlame', ['#ffd36b', '#ff8a3d', '#ff4f6d'])}${grad('gDiamondR', ['#9ff0ff', '#5a4bd1'])}${grad('gDiamondF', ['#e6fbff', '#7fd8ff', '#8a7dff', '#c47dff'])}
    </defs></svg>`;
    document.body.appendChild(div.firstElementChild);
  }

  // ----- всплывающее уведомление -----
  const queue = [];
  let showing = false, hurry = null; // hurry: досрочно убрать обычное уведомление
  function toast(d, tier) {
    // торжество задачи дня показываем раньше обычных уведомлений
    if (d.group === 'daily') {
      const k = queue.findIndex(([q]) => q.group !== 'daily'); queue.splice(k < 0 ? queue.length : k, 0, [d, tier]);
      if (showing && hurry) hurry();
    }
    else queue.push([d, tier]);
    if (!showing) setTimeout(nextToast, 350);
  }
  function nextToast() {
    const it = queue.shift();
    if (!it) { showing = false; return; }
    showing = true;
    const [d, tier] = it, names = tierNames(d.tiers.length), t = names[tier - 1];
    if (d.group === 'daily') return celebrate(d, tier, t, names);
    const el = document.createElement('button');
    el.className = `ach-toast t-${t}`;
    el.innerHTML = `<span class="ach-toast-medal">${medal(d, tier)}<i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="ach-toast-txt"><small>Достижение${names.length > 1 ? ' · ' + TIERS[t] : ''}</small><b>${d.title}</b><em>${d.desc(d.tiers[tier - 1])}</em></span>`;
    el.onclick = () => { finish(); showcase(d.id); };
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    let done = false;
    const timer = setTimeout(finish, queue.length > 1 ? 2600 : 4200);
    hurry = finish;
    function finish() {
      if (done) return; done = true; clearTimeout(timer); hurry = null;
      el.classList.remove('in'); el.classList.add('out');
      setTimeout(() => { el.remove(); nextToast(); }, 450);
    }
    refreshDot();
  }
  // Большое торжество для достижений задачи дня: медаль вылетает в центр, лучи, конфетти
  function celebrate(d, tier, t, names) {
    const el = document.createElement('div');
    el.className = `ach-party t-${t}`;
    const bits = Array.from({ length: 28 }, (_, k) => {
      const a = k / 28 * Math.PI * 2 + Math.random() * .3, r = 110 + Math.random() * 90;
      return `<i style="--dx:${Math.round(Math.cos(a) * r)}px;--dy:${Math.round(Math.sin(a) * r)}px;--d:${(Math.random() * .25).toFixed(2)}s;--c:${['#ffd36b', '#ff7aa6', '#ab9dff', '#9ff0ff', '#ff9f43'][k % 5]};--rot:${Math.random() * 360 | 0}deg"></i>`;
    }).join('');
    el.innerHTML = `<div class="ap-card" role="dialog" aria-label="Новое достижение">
      <span class="ap-rays"></span><span class="ap-medal">${medal(d, tier)}</span><span class="ap-bits">${bits}</span>
      <small>Задача дня · ${names.length > 1 ? TIERS[t] : 'достижение'}</small>
      <b>${d.title}</b><em>${d.desc(d.tiers[tier - 1])}</em>
      <span class="ap-tap">Нажми, чтобы посмотреть в витрине</span></div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    let done = false;
    const timer = setTimeout(() => finish(false), 4800);
    function finish(go) {
      if (done) return; done = true; clearTimeout(timer);
      el.classList.remove('in'); el.classList.add('out');
      setTimeout(() => { el.remove(); if (go) showcase(d.id); nextToast(); }, 380);
    }
    el.onclick = e => finish(e.target.closest('.ap-card'));
    refreshDot();
  }
  function refreshDot() { const b = $('profileBtn'); if (b) b.classList.toggle('dot', unseen() > 0); }

  // ----- витрина -----
  function progressOf(d) {
    const v = d.val(), r = reachedOf(d, v), next = d.tiers[r];
    const show = x => (d.fmt ? d.fmt(x) : x + (d.unit || ''));
    if (next === undefined) return { r, pct: 100, text: 'Все уровни открыты' };
    if (d.low) {
      const has = v !== Infinity;
      return { r, pct: has ? Math.min(99, Math.round(next / v * 100)) : 0, text: has ? `Лучшее ${show(v)} · нужно ${show(next)}` : `Нужно быстрее ${show(next)}` };
    }
    if (d.min && total.correct() + total.wrong() < d.min) {
      const m = total.correct() + total.wrong();
      return { r, pct: Math.round(m / d.min * 100), text: `Ещё ${n(d.min - m, 'ход', 'хода', 'ходов')} до подсчёта` };
    }
    const base = r ? d.tiers[r - 1] : 0;
    const pct = d.unit === '%' ? Math.round(v / next * 100) : Math.max(0, Math.min(99, Math.round((v - base) / (next - base) * 100)));
    return { r, pct, text: `${show(Math.min(v, next))} из ${show(next)}` };
  }

  function panel(html, cls = '') {
    const root = $('sheetRoot');
    root.innerHTML = `<div class="sheet-back"><div class="sheet panel ${cls}" role="dialog" aria-modal="true">
      <button class="panel-close" id="panelClose" aria-label="Закрыть">×</button>${html}</div></div>`;
    const close = () => { root.innerHTML = ''; };
    $('panelClose').onclick = close;
    root.querySelector('.sheet-back').addEventListener('pointerdown', e => { if (e.target.classList.contains('sheet-back')) close(); });
    return root.querySelector('.panel');
  }

  function showcase(focus) {
    defsSvg();
    const all = defs();
    const levels = all.reduce((a, d) => a + d.tiers.length, 0);
    const got = all.reduce((a, d) => a + ((st.ach[d.id] || {}).tier || 0), 0);
    const groups = [['Общие', all.filter(d => !d.game && !d.group)], ...Object.keys(META).map(g => [META[g].title, all.filter(d => d.game === g)])];
    const daily = all.filter(d => d.group === 'daily'), ds = typeof Daily !== 'undefined' ? Daily.summary() : null;
    const card = d => {
      const p = progressOf(d), names = tierNames(d.tiers.length), isNew = st.ach[d.id] && !st.seen[d.id];
      return `<button class="badge ${p.r ? 't-' + names[p.r - 1] : 'locked'} ${isNew ? 'new' : ''}" data-id="${d.id}">
        <span class="badge-medal">${medal(d, p.r)}</span>
        <b>${d.title}</b>
        <span class="pips">${names.map((t, k) => `<i class="${k < p.r ? 'on p-' + t : ''}"></i>`).join('')}</span>
        <span class="prog"><i style="width:${p.r === d.tiers.length ? 100 : p.pct}%"></i></span>
      </button>`;
    };
    const el = panel(`
      <div class="sc-head">
        <div class="sc-ring" style="--p:${Math.round(got / levels * 100)}"><b>${got}</b><small>из ${levels}</small></div>
        <div><h2>Витрина достижений</h2><p class="muted">${Profiles.esc(Profiles.active().name)}, открыто ${n(got, 'уровень', 'уровня', 'уровней')} в ${n(Object.keys(st.ach).length, 'достижении', 'достижениях', 'достижениях')} из ${all.length}.</p></div>
      </div>
      ${daily.length ? `<section class="sc-daily">
        <div class="sc-daily-h"><span class="dl-fire ${ds && ds.todayDone ? 'lit' : ''}">${ds ? Daily.FLAME : ''}</span>
          <div><h3>Задача дня</h3><small>${ds ? `серия ${ds.streak} · лучшая ${ds.best} · ${n(ds.total, 'задача решена', 'задачи решено', 'задач решено')}` : ''}</small></div></div>
        <div class="badges">${daily.map(card).join('')}</div></section>` : ''}
      ${groups.map(([t, ds]) => `<h3 class="sc-group">${t}</h3><div class="badges">${ds.map(card).join('')}</div>`).join('')}
      <button class="sc-back" id="scBack">← К профилю</button>`, 'showcase');
    el.querySelectorAll('.badge').forEach(b => b.onclick = () => detail(all.find(d => d.id === b.dataset.id)));
    $('scBack').onclick = profile;
    // всё, что увидели в витрине, больше не «новое»
    for (const id of Object.keys(st.ach)) st.seen[id] = 1;
    save(); refreshDot();
    if (focus) { const b = el.querySelector(`[data-id="${focus}"]`); if (b) { b.scrollIntoView({ block: 'center' }); b.classList.add('focus'); } }
  }

  function detail(d) {
    const p = progressOf(d), names = tierNames(d.tiers.length), at = (st.ach[d.id] || {}).at || [];
    const show = x => (d.fmt ? d.fmt(x) : x + (d.unit || ''));
    const el = panel(`
      <div class="ach-detail ${p.r ? 't-' + names[p.r - 1] : 'locked'}">
        <span class="ach-big">${medal(d, p.r)}</span>
        ${d.game ? `<span class="chip">${META[d.game].title}</span>` : ''}
        <h2>${d.title}</h2>
        <p class="muted">${p.text}</p>
        <ol class="tiers">${d.tiers.map((t, k) => `<li class="${k < p.r ? 'done' : ''}">
          <span class="tier-dot p-${names[k]}"></span>
          <span><b>${names.length > 1 ? TIERS[names[k]] : 'Открыть'}</b><small>${d.desc(t)}</small></span>
          <em>${k < p.r ? (at[k] ? new Date(at[k]).toLocaleDateString('ru', { day: 'numeric', month: 'short' }) : '✓') : (k === p.r ? p.pct + '%' : show(t))}</em></li>`).join('')}</ol>
      </div>
      <button class="sc-back" id="dtBack">← Ко всем достижениям</button>`, 'detail');
    $('dtBack').onclick = () => showcase(d.id);
  }

  // ----- профиль и статистика -----
  function profile() {
    defsSvg();
    const me = Profiles.active(), all = defs();
    const c = total.correct(), w = total.wrong(), acc = accuracy(c, w);
    const recent = all.filter(d => st.ach[d.id]).sort((a, b) => Math.max(...st.ach[b.id].at) - Math.max(...st.ach[a.id].at)).slice(0, 3);
    const got = all.reduce((a, d) => a + ((st.ach[d.id] || {}).tier || 0), 0), levels = all.reduce((a, d) => a + d.tiers.length, 0);
    const gameRows = Object.keys(META).map(gid => {
      const g = G(gid), a = accuracy(g.correct, g.wrong);
      return `<div class="pf-game"><div class="pf-game-h"><b>${META[gid].title}</b><span>${n(winsOf(g), 'победа', 'победы', 'побед')} · точность ${a === null ? '—' : a + '%'}</span></div>
        <div class="pf-lv">${Object.entries(LEVELS).map(([l, name]) => `<div><small>${name}</small><b>${g.wins[l] || 0}</b><span>${g.best[l] ? '⏱ ' + fmt(g.best[l]) : '—'}</span></div>`).join('')}</div></div>`;
    }).join('');
    const el = panel(`
      <div class="pf-top">${Profiles.avatar(me, 'big')}<div><h2>${Profiles.esc(me.name)}</h2><button class="link" id="pfEdit">Изменить профиль</button></div></div>
      <div class="pf-stats">
        <div><b>${total.wins()}</b><small>${plural(total.wins(), 'победа', 'победы', 'побед')}</small></div>
        <div><b>${acc === null ? '—' : acc + '%'}</b><small>точность</small></div>
        <div><b>${c}</b><small>верных ходов</small></div>
        <div><b>${total.hints()}</b><small>${plural(total.hints(), 'подсказка', 'подсказки', 'подсказок')}</small></div>
        <div><b>${hm(total.time())}</b><small>в игре</small></div>
        <div><b>${st.days.streak}${st.days.best > st.days.streak ? `<i>/${st.days.best}</i>` : ''}</b><small>${plural(st.days.streak, 'день', 'дня', 'дней')} подряд</small></div>
      </div>
      <button class="pf-showcase" id="pfShow">
        <span class="pf-show-medals">${recent.length ? recent.map(d => medal(d, st.ach[d.id].tier)).join('') : medal({ icon: 'trophy', tiers: [1] }, 0)}</span>
        <span class="pf-show-txt"><b>Витрина достижений</b><small>${got} из ${levels} уровней${unseen() ? ` · <em>новых: ${unseen()}</em>` : ''}</small></span>
        <span class="chev">›</span>
      </button>
      ${typeof Daily !== 'undefined' ? (() => { const ds = Daily.summary(); return `<button class="pf-daily ${ds.todayDone ? 'lit' : ''}" id="pfDaily">
        <span class="dl-fire">${Daily.FLAME}</span>
        <span class="pf-show-txt"><b>Задача дня</b><small>Серия ${ds.streak} · лучшая ${ds.best} · решено ${ds.total} · заморозок ${ds.freezes}</small></span>
        <span class="chev">›</span></button>`; })() : ''}
      <h3 class="sc-group">По играм</h3>
      ${gameRows}
      <h3 class="sc-group">Игроки на этом устройстве</h3>
      <div class="pf-list">
        ${Profiles.list().map(p => `<button class="pf-row" data-id="${p.id}" aria-pressed="${p.id === me.id}">${Profiles.avatar(p)}<span>${Profiles.esc(p.name)}</span>${p.id === me.id ? '<em>играет сейчас</em>' : '<em>переключиться</em>'}</button>`).join('')}
        <button class="pf-row add" id="pfAdd"><span class="avatar add">+</span><span>Новый игрок</span></button>
      </div>
      <p class="muted small">Профили и прогресс хранятся только на этом устройстве.</p>`, 'profile');
    $('pfShow').onclick = () => showcase();
    if ($('pfDaily')) $('pfDaily').onclick = () => Daily.open();
    $('pfEdit').onclick = async () => { await Profiles.edit(); renderAvatar(); profile(); };
    $('pfAdd').onclick = async () => { if (!(await Profiles.add())) profile(); };
    el.querySelectorAll('.pf-row[data-id]').forEach(b => b.onclick = () => Profiles.switchTo(b.dataset.id));
  }
  function renderAvatar() {
    const b = $('profileBtn'), me = Profiles.active();
    b.innerHTML = Profiles.avatar(me);
    b.setAttribute('aria-label', `Профиль: ${me.name}`);
    refreshDot();
  }
  function initUI() {
    defsSvg();
    // достижения за то, что было сыграно до их появления, открываются тихо и ждут в витрине
    check(!st.init);
    st.init = true; save();
    renderAvatar();
    $('profileBtn').onclick = profile;
  }

  load();
  addEventListener('pagehide', save);
  addEventListener('lg-save', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  return { register, addGlobal, panel, seed, start, move, bump, hint, tick, win, wins: gid => winsOf(G(gid)), initUI, refresh: renderAvatar, profile, showcase };
})();

// ===== Задача дня =====
// Каждый день в каждой игре одна общая для всех головоломка повышенной сложности.
// Поле зависит только от даты: генератор запускается с зерном «игра + дата», поэтому у всех
// игроков и на всех телефонах в один день одинаковые задачи. День меняется в полночь по Москве.
const Daily = (() => {
  const FIRST = '2026-10-01';          // самый ранний день в календаре
  const ORDER = ['suguru', 'sudoku', 'killer'];
  const KEY = () => Profiles.key('logicgames-daily');
  const CACHE = 'logicgames-daily-cache';  // готовые поля, общие для всех профилей
  const MAX_FREEZE = 2;
  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const n = (v, a, b, c) => `${v} ${plural(v, a, b, c)}`;

  // ----- даты по Москве (UTC+3 круглый год) -----
  const MSK = 3 * 3600e3;
  const today = () => new Date(Date.now() + MSK).toISOString().slice(0, 10);
  const addDays = (d, k) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + k); return t.toISOString().slice(0, 10); };
  const dow = d => (new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7; // 0 = понедельник
  const human = d => `${+d.slice(8)} ${MONTHS_GEN[+d.slice(5, 7) - 1]}`;
  function untilMidnight() {
    const ms = 864e5 - (Date.now() + MSK) % 864e5, m = Math.ceil(ms / 6e4);
    return m >= 60 ? `${Math.floor(m / 60)} ч ${m % 60} мин` : n(m, 'минуту', 'минуты', 'минут');
  }

  // ----- воспроизводимый генератор -----
  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    let a = h >>> 0;
    return () => {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const count = a => a.reduce((s, v) => s + (v ? 1 : 0), 0);
  // из нескольких «сложных» берём самую трудную: где чаще нужны приёмы сложнее одиночек
  const GEN = {
    suguru: { tries: 4, make: () => Suguru.generate('hard'), score: p => Suguru.logicSolve(Suguru.buildGeo(p.reg), p.givens, 2).tricks * 10 - count(p.givens) },
    sudoku: { tries: 3, make: () => Sudoku12.generate('hard'), score: p => Sudoku12.logicSolve(p.givens, 2).tricks * 10 - count(p.givens) },
    killer: { tries: 2, make: () => Killer.generate('hard'), score: p => Killer.logicSolve(p.givens, Killer.buildGeo(p.cages), 3).tricks * 10 - p.cages.length },
  };
  function build(gid, date) {
    const g = GEN[gid], orig = Math.random;
    Math.random = seeded(`logicgames-daily:${gid}:${date}:v1`);
    try {
      let best = null, bs = -Infinity;
      for (let k = 0; k < g.tries; k++) { const p = g.make(), s = g.score(p); if (s > bs) { bs = s; best = p; } }
      return best;
    } finally { Math.random = orig; }
  }
  function puzzle(gid, date) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (e) {}
    if (!c || c.v !== 1) c = { v: 1, items: {} };
    const k = gid + ':' + date;
    if (!c.items[k]) {
      c.items[k] = build(gid, date);
      const keys = Object.keys(c.items);
      if (keys.length > 12) keys.sort((a, b) => a.slice(-10).localeCompare(b.slice(-10))).slice(0, keys.length - 12).forEach(x => delete c.items[x]);
      try { localStorage.setItem(CACHE, JSON.stringify(c)); } catch (e) {}
    }
    return JSON.parse(JSON.stringify(c.items[k]));
  }

  // ----- что решено -----
  // st.s[дата][игра] = { at: дата решения по Москве, t: секунды, h: подсказки, m: ошибки }
  let st = null;
  function load() {
    try { st = JSON.parse(localStorage.getItem(KEY()) || 'null'); } catch (e) {}
    if (!st || typeof st.s !== 'object') st = { s: {} };
  }
  function save() { if (Profiles.locked) return; try { localStorage.setItem(KEY(), JSON.stringify(st)); } catch (e) {} }
  const rec = (d, gid) => (st.s[d] || {})[gid];
  const onTime = d => ORDER.some(g => { const r = rec(d, g); return r && r.at === d; });

  // Серия: день засчитан, если в этот же день (по Москве) решена хотя бы одна его задача.
  // Заморозки: одна есть с самого начала, каждый понедельник добавляется ещё одна, копить можно до двух.
  // Пропуск при ненулевой серии сам тратит заморозку, серия не прерывается (но и не растёт).
  let memo = null, ver = 0;
  function streak() {
    const t = today(), key = t + ':' + ver;
    if (memo && memo.key === key) return memo;
    const days = Object.keys(st.s).filter(onTime).sort();
    const r = { streak: 0, best: 0, freezes: 1, frozen: new Set(), savedByFreeze: 0, todayDone: onTime(t), key };
    if (days.length) {
      for (let d = days[0]; d <= t; d = addDays(d, 1)) {
        if (d !== days[0] && dow(d) === 0) r.freezes = Math.min(MAX_FREEZE, r.freezes + 1);
        if (onTime(d)) { r.streak++; r.best = Math.max(r.best, r.streak); if (r.pendingFreeze) { r.savedByFreeze++; r.pendingFreeze = 0; } }
        else if (d === t) { /* сегодня ещё можно успеть */ }
        else if (r.streak > 0 && r.freezes > 0) { r.freezes--; r.frozen.add(d); r.pendingFreeze = 1; }
        else { r.streak = 0; r.pendingFreeze = 0; }
      }
    }
    return (memo = r);
  }
  function stats() {
    let total = 0, solo = 0, late = 0, full = 0;
    for (const [d, gs] of Object.entries(st.s)) {
      let same = 0;
      for (const g of ORDER) {
        const r = gs[g]; if (!r) continue;
        total++; if (!r.h) solo++; if (r.at !== d) late++; else same++;
      }
      if (same === ORDER.length) full++;
    }
    return { total, solo, late, full };
  }

  function solved(gid, date, { elapsed, hints, mistakes }) {
    const before = streak().streak, t = today();
    const first = !rec(date, gid);
    if (first) { ver++; (st.s[date] = st.s[date] || {})[gid] = { at: t, t: elapsed, h: hints, m: mistakes }; save(); }
    const s = streak(), left = ORDER.filter(g => !rec(date, g));
    let html;
    if (date !== t) html = `<p class="dl-note">${date < t ? 'Пропущенный день' : 'День'} отмечен в календаре. Серию прошлые дни не продлевают, но достижения за задачи дня считаются.</p>`;
    else if (s.streak > before) html = `<div class="dl-win"><span class="dl-fire">${FLAME}</span><div><b>${n(s.streak, 'день', 'дня', 'дней')} подряд</b><small>${s.streak === 1 ? 'Серия началась! Завтра будет новая задача.' : 'Серия продлена, так держать!'}</small></div></div>`;
    else html = `<div class="dl-win"><span class="dl-fire">${FLAME}</span><div><b>${n(s.streak, 'день', 'дня', 'дней')} подряд</b><small>${left.length ? `Осталось ${n(left.length, 'задача', 'задачи', 'задач')} этого дня` : 'Все три задачи дня решены!'}</small></div></div>`;
    return { title: date === t ? 'Задача дня решена!' : `${human(date)}: решено!`, html, first };
  }

  // ----- достижения -----
  Track.addGlobal(() => {
    const s = () => stats();
    return [
      { id: 'daily-streak', group: 'daily', icon: 'flame', title: 'Огонёк', tiers: [3, 7, 30, 100], val: () => streak().best, desc: t => `Решай задачу дня ${n(t, 'день', 'дня', 'дней')} подряд` },
      { id: 'daily-count', group: 'daily', icon: 'calendar', title: 'Задачи дня', tiers: [1, 10, 50, 200], val: () => s().total, desc: t => (t === 1 ? 'Реши первую задачу дня' : `Реши ${n(t, 'задачу', 'задачи', 'задач')} дня`) },
      { id: 'daily-full', group: 'daily', icon: 'triple', title: 'Полный день', tiers: [1, 7, 30], val: () => s().full, desc: t => `Реши все три задачи дня в тот же день${t > 1 ? ` ${n(t, 'раз', 'раза', 'раз')}` : ''}` },
      { id: 'daily-solo', group: 'daily', icon: 'bulb', title: 'Ясная голова', tiers: [5, 25, 100], val: () => s().solo, desc: t => `Реши ${n(t, 'задачу', 'задачи', 'задач')} дня без подсказок` },
      { id: 'daily-late', group: 'daily', icon: 'rewind', title: 'Наверстаю', tiers: [1, 5, 20], val: () => s().late, desc: t => `Реши ${n(t, 'пропущенную задачу', 'пропущенные задачи', 'пропущенных задач')} из календаря` },
      { id: 'daily-freeze', group: 'daily', icon: 'snow', title: 'Морозоустойчивость', tiers: [1], val: () => streak().savedByFreeze, desc: () => `Заморозка спасла серию, и ты ${Profiles.G('продолжила', 'продолжил')} её` },
    ];
  });

  // ----- баннер на главной -----
  const FLAME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-2.8 7-6.8 0-3.7-2.6-5.7-4-9.2-1 2-2 3-3.6 3.2.2-2.4-.4-4.6-2.4-6.7-.8 4.4-5 6.8-5 12.4C4 19.2 7.6 22 12 22Z"/><path class="core" d="M12 22c-1.7 0-3-1.2-3-3 0-2 1.6-2.8 2.5-4.6.9 1.5 3.5 2.5 3.5 4.6 0 1.8-1.3 3-3 3Z"/></svg>';
  const SNOW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.5 4l2.5 2.5L14.5 4M9.5 20l2.5-2.5 2.5 2.5"/></svg>';
  const cur = () => (typeof GAMES !== 'undefined' && typeof current !== 'undefined' ? current : 'suguru');
  let lastDay = '';
  function changed() {
    if (typeof GAMES === 'undefined') return;
    for (const k in GAMES) { const el = $('screen-' + k); if (el) el.classList.toggle('is-daily', !!GAMES[k].app.daily()); }
    renderBar();
  }
  function renderBar() {
    const bar = $('dailyBar'); if (!bar) return;
    const t = today(); lastDay = t;
    const s = streak(), playing = GAMES[cur()].app.daily();
    if (playing) {
      const g = GAMES[cur()];
      bar.className = 'daily-bar in-daily';
      bar.innerHTML = `<button class="db-main" id="dbOpen"><span class="db-cal"><b>${+playing.slice(8)}</b><small>${MONTHS_GEN[+playing.slice(5, 7) - 1].slice(0, 3)}</small></span>
        <span class="db-txt"><b>${playing === t ? 'Задача дня' : 'Задача ' + human(playing)}</b><small>${g.title} · повышенная сложность</small></span></button>
        <button class="db-exit" id="dbExit">Выйти<span aria-hidden="true">×</span></button>`;
      $('dbExit').onclick = () => GAMES[cur()].app.leaveDaily();
    } else {
      const done = ORDER.filter(g => rec(t, g)).length;
      const sub = s.todayDone ? (done < 3 ? `Серия продлена · решено ${done} из 3` : 'Все три решены, до завтра!')
        : s.streak ? 'Реши одну из трёх, продли серию' : 'Реши одну из трёх и начни серию';
      bar.className = `daily-bar ${s.todayDone ? 'lit' : s.streak ? 'warn' : ''}`;
      bar.innerHTML = `<button class="db-main" id="dbOpen"><span class="db-flame">${FLAME}<b>${s.streak}</b></span>
        <span class="db-txt"><b>Задача дня</b><small>${sub}</small></span>
        <span class="db-dots">${ORDER.map(g => `<i class="${rec(t, g) ? 'on' : ''}"></i>`).join('')}</span><span class="chev" aria-hidden="true">›</span></button>`;
    }
    $('dbOpen').onclick = () => open();
    $('dbOpen').classList.toggle('pulse', !playing && !s.todayDone);
  }
  function tick() { if (today() !== lastDay) { renderBar(); } }

  // ----- окно «Задача дня» с календарём -----
  let selDay = null, month = null;
  // day: выбранный день (по умолчанию сегодня), keep: не перелистывать календарь
  function open(day, keep) {
    const t = today();
    selDay = day || t;
    if (!keep || !month) month = selDay.slice(0, 7);
    const s = streak(), x = stats();
    const card = gid => {
      const g = GAMES[gid], r = rec(selDay, gid), prog = GAMES[gid].app.daily() === selDay;
      const state = r ? `<em class="ok">✓ ${fmt(r.t)}</em>` : prog ? '<em class="go">Играю</em>' : '<em>Начать</em>';
      return `<button class="dl-card ${r ? 'done' : ''}" data-g="${gid}" ${r ? 'disabled' : ''}>
        <span class="game-ico ${gid}" aria-hidden="true"></span>
        <span class="game-txt"><b>${g.title} <i>${g.size}</i></b><small>${r ? (r.at === selDay ? 'Решено в срок' : `Решено ${human(r.at)}`) + (r.h ? ` · ${n(r.h, 'подсказка', 'подсказки', 'подсказок')}` : ' · без подсказок') : 'Повышенная сложность'}</small></span>${state}</button>`;
    };
    // календарь месяца
    const [y, m] = month.split('-').map(Number);
    const first = `${month}-01`, dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = '';
    for (let k = 0; k < dow(first); k++) cells += '<span></span>';
    for (let dd = 1; dd <= dim; dd++) {
      const d = `${month}-${String(dd).padStart(2, '0')}`, gs = st.s[d] || {}, cnt = ORDER.filter(g => gs[g]).length;
      const cls = [d === t ? 'today' : '', d === selDay ? 'sel' : '', onTime(d) ? 'fire' : cnt ? 'late' : '', s.frozen.has(d) ? 'frozen' : '', cnt === 3 ? 'full' : '', d > t || d < FIRST ? 'off' : ''].filter(Boolean).join(' ');
      cells += `<button class="cal-d ${cls}" data-d="${d}" ${d > t || d < FIRST ? 'disabled' : ''}><b>${dd}</b>${s.frozen.has(d) ? `<span class="cal-snow">${SNOW}</span>` : `<span class="cal-dots">${ORDER.map(g => `<i class="${gs[g] ? 'on' : ''}"></i>`).join('')}</span>`}</button>`;

        <div class="dl-freeze" title="Заморозки">${Array.from({ length: MAX_FREEZE }, (_, k) => `<span class="${k < s.freezes ? 'on' : ''}">${SNOW}</span>`).join('')}<small>${n(s.freezes, 'заморозка', 'заморозки', 'заморозок')}</small></div>
      </div>
      <div class="dl-day"><h2>${selDay === t ? 'Сегодня' : human(selDay)}</h2><small>${selDay === t ? `${human(t)} · новые через ${untilMidnight()}` : 'Прошлый день: серию не продлит, но попадёт в календарь'}</small></div>
      <div class="games">${ORDER.map(card).join('')}</div>
      <div class="cal">
        <div class="cal-head"><button class="cal-nav" id="calPrev" ${prevM < FIRST.slice(0, 7) ? 'disabled' : ''} aria-label="Предыдущий месяц">‹</button>
          <b>${MONTHS[m - 1]} ${y}</b>
          <button class="cal-nav" id="calNext" ${nextM > t.slice(0, 7) ? 'disabled' : ''} aria-label="Следующий месяц">›</button></div>
